name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: library-linux-x86_64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: library-linux-aarch64

    # Linux-only for now: library shells out to rsvg-convert/curl and targets
    # the Fe2O3 Linux desktop. The binary itself is portable Rust.

    steps:
      - uses: actions/checkout@v4
        with:
          path: library

      - name: Checkout crust
        uses: actions/checkout@v4
        with:
          repository: isene/crust
          path: crust

      - name: Checkout glow
        uses: actions/checkout@v4
        with:
          repository: isene/glow
          path: glow

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Build
        working-directory: library
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        working-directory: library
        run: |
          cp target/${{ matrix.target }}/release/library ../${{ matrix.artifact }}
          chmod +x ../${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*/*
          generate_release_notes: true
          body: |
            ## Installation

            Download the binary for your platform:
            ```bash
            chmod +x library-*
            mkdir -p ~/bin && mv library-linux-x86_64 ~/bin/library
            ```

            ## Platforms
            - `library-linux-x86_64` — Linux (Intel/AMD 64-bit)
            - `library-linux-aarch64` — Linux (ARM 64-bit, Raspberry Pi)

            ## Requirements
            The `claude` CLI on PATH, plus `rsvg-convert` and `curl`. A
            kitty-graphics terminal shows inline figures.
