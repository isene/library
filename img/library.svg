<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="70%">
      <stop offset="0%" style="stop-color:#241c12"/>
      <stop offset="100%" style="stop-color:#0c0a07"/>
    </radialGradient>
    <linearGradient id="rust" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f74c00"/>
      <stop offset="100%" style="stop-color:#b7410e"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f4dd9a"/>
      <stop offset="100%" style="stop-color:#d9a93c"/>
    </linearGradient>
    <radialGradient id="spark" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#fff4cf"/>
      <stop offset="60%" style="stop-color:#f0d080"/>
      <stop offset="100%" style="stop-color:#f0d080" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    @keyframes twinkle { 0%,100% { opacity: .25; transform: scale(.7); } 50% { opacity: 1; transform: scale(1); } }
    @keyframes drift   { 0%,100% { opacity: .35; } 50% { opacity: .9; } }
    .s1 { animation: twinkle 2.4s ease-in-out infinite;       transform-origin: 128px 60px; }
    .s2 { animation: twinkle 2.0s ease-in-out infinite .6s;   transform-origin: 104px 70px; }
    .s3 { animation: twinkle 2.8s ease-in-out infinite 1.1s;  transform-origin: 152px 66px; }
    .pg { animation: drift 3.6s ease-in-out infinite; }
  </style>

  <!-- disc + rust border (suite house style) -->
  <circle cx="128" cy="128" r="120" fill="url(#bg)" stroke="url(#rust)" stroke-width="3"/>

  <!-- conjuring sparks above the book: the library writes what should exist -->
  <circle class="s1" cx="128" cy="60" r="6"  fill="url(#spark)"/>
  <circle class="s2" cx="104" cy="70" r="4"  fill="url(#spark)"/>
  <circle class="s3" cx="152" cy="66" r="4"  fill="url(#spark)"/>

  <!-- open book, centred -->
  <g transform="translate(0,4)">
    <!-- page fills -->
    <path class="pg" d="M128 96 C 106 84, 70 84, 54 92 L54 178 C 70 170, 106 170, 128 182 Z"
          fill="url(#gold)" fill-opacity="0.16"/>
    <path class="pg" d="M128 96 C 150 84, 186 84, 202 92 L202 178 C 186 170, 150 170, 128 182 Z"
          fill="url(#gold)" fill-opacity="0.10"/>
    <!-- spine + page outlines -->
    <g fill="none" stroke="url(#gold)" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
      <path d="M128 96 L128 182"/>
      <path d="M128 96 C 106 84, 70 84, 54 92 L54 178 C 70 170, 106 170, 128 182"/>
      <path d="M128 96 C 150 84, 186 84, 202 92 L202 178 C 186 170, 150 170, 128 182"/>
    </g>
    <!-- text lines -->
    <g stroke="#f0d080" stroke-width="3" stroke-linecap="round" opacity="0.8">
      <path d="M66 108 L114 112"/><path d="M66 122 L114 126"/><path d="M66 136 L114 140"/><path d="M66 150 L106 154"/>
      <path d="M142 112 L190 108"/><path d="M142 126 L190 122"/><path d="M142 140 L190 136"/><path d="M142 154 L182 150"/>
    </g>
  </g>

  <!-- wordmark -->
  <text x="128" y="226" text-anchor="middle"
        font-family="system-ui, -apple-system, sans-serif"
        font-size="20" font-weight="700" fill="#f0d080" letter-spacing="2">
    library
  </text>
</svg>
