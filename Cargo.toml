[package]
name = "library"
version = "0.1.0"
edition = "2021"
authors = ["Geir Isene <g@isene.com>"]
description = "Generative personal library TUI — curate a shelf of books that should exist, then have them written on demand."
license = "Unlicense"
repository = "https://github.com/isene/library"

[dependencies]
crust = { version = "0.1", path = "../crust", package = "fe2o3-crust" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
strip = true
